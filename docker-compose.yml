services:
  # ---------------------------------------------------------------------------
  # Banco da aplicação
  # ---------------------------------------------------------------------------
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    volumes:
      - dados_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # API FastAPI
  # ---------------------------------------------------------------------------
  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ADMIN_HABILITADO: ${ADMIN_HABILITADO:-false}
      DOCS_HABILITADO: ${DOCS_HABILITADO:-false}
      # Keycloak — aponta para o keycloak-server externo
      # Mude KEYCLOAK_HABILITADO para true quando o keycloak-server estiver no ar
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8080}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/enxoval}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-enxoval}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-webapp}
      KEYCLOAK_HABILITADO: ${KEYCLOAK_HABILITADO:-false}
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Frontend Vite/React
  # ---------------------------------------------------------------------------
  web:
    build: ./web
    restart: unless-stopped
    environment:
      VITE_KEYCLOAK_HABILITADO: ${KEYCLOAK_HABILITADO:-false}
      VITE_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-enxoval}
      VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-webapp}
    depends_on:
      - api

  # ---------------------------------------------------------------------------
  # Testes E2E (Playwright + axe). Não sobe automaticamente.
  # Uso: docker compose run --rm e2e
  # ---------------------------------------------------------------------------
  e2e:
    build:
      context: ./web
      dockerfile: Dockerfile.e2e
    environment:
      BASE_URL: http://web:5173
      API_URL: http://api:8000
      LIMITE_CRIACAO_MAXIMO: 1000
    depends_on:
      - web
      - api
    volumes:
      - ./web:/app
      - /app/node_modules
    profiles:
      - e2e

volumes:
  dados_db:
  node_modules_web:
