services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    volumes:
      - dados_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ADMIN_HABILITADO: ${ADMIN_HABILITADO:-false}
      DOCS_HABILITADO: ${DOCS_HABILITADO:-false}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api

  # Serviço de testes E2E (Playwright + axe). Não sobe automaticamente.
  # Uso: docker compose run --rm e2e
  e2e:
    build:
      context: ./web
      dockerfile: Dockerfile.e2e
    environment:
      BASE_URL: http://web:5173
      API_URL: http://api:8000
      # Desabilita rate limit de criação para os testes E2E não receberem 429
      LIMITE_CRIACAO_MAXIMO: 1000
    depends_on:
      - web
      - api
    volumes:
      # Monta o código-fonte para edição sem rebuild (dev)
      - ./web:/app
      - /app/node_modules
    profiles:
      - e2e

volumes:
  dados_db:
  node_modules_web:
